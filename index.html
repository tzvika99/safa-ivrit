<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yafa Safa - Learn Hebrew from English (יָפָה שָׂפָה)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-owl: 88, 204, 2;
      --color-tree-frog: 88, 167, 0;
      --color-macaw: 28, 176, 246;
      --color-macaw-shadow: 0, 150, 221;
      --color-bee: 255, 200, 0;
      --color-camel: 231, 166, 1;
      --color-cardinal: 255, 75, 75;
      --color-fire-ant: 234, 43, 43;
      --color-fox: 255, 150, 0;
      --color-beetle: 206, 130, 255;
      --color-swan: 229, 229, 229;
      --color-hare: 175, 175, 175;
      --color-wolf: 119, 119, 119;
      --color-eel: 75, 75, 75;
      --color-polar: 247, 247, 247;
      --color-iguana: 221, 244, 255;
      --color-sea-sponge: 215, 255, 184;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: radial-gradient(1200px 500px at 85% -10%, #e6f6ff 0, transparent 60%), radial-gradient(900px 500px at -10% 110%, #effcdf 0, transparent 60%), #ffffff !important; background-attachment: fixed; }
    #primary-sidebar { background: linear-gradient(180deg, #ffffff 0%, #f5fbff 100%) !important; box-shadow: 4px 0 24px rgba(28,176,246,.08); }
    main .rounded-3xl, main .rounded-2xl.border-2 { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    main .grid > .rounded-2xl:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(28,176,246,.14); }
    main h1 { letter-spacing: -.01em; }
    .yafa-main > div, .yafa-main > section { animation: fadeUp .35s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .gz-typing span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:#84d8ff; animation: tp 1s infinite; }
    .gz-typing span:nth-child(2){ animation-delay:.15s } .gz-typing span:nth-child(3){ animation-delay:.3s }
    @keyframes tp { 0%,80%,100%{ transform: translateY(0); opacity:.5 } 40%{ transform: translateY(-5px); opacity:1 } }
    .chat-bubble i { font-style: italic; color: #1899d6; }
    .chip { cursor:pointer; transition: background .15s; } .chip:hover { background:#ddf4ff; }
    body { font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #ffffff; color: #3c3c3c; overflow-x: hidden; }
    .font-hebrew { font-family: 'Rubik', 'Assistant', Arial, sans-serif; direction: rtl; }

    /* Brand Title Multi-color styling (Blue, Green & Red) */
    .brand-yafa { color: #1cb0f6; text-shadow: 0 2px 0 rgba(0, 150, 221, 0.22); }
    .brand-safa { color: #58cc02; text-shadow: 0 2px 0 rgba(88, 167, 0, 0.22); }
    .brand-dot  { color: #ff4b4b; }

    .duo-btn-green {
      background-color: rgb(var(--color-owl));
      box-shadow: 0 4px 0 rgb(var(--color-tree-frog));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-green:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-tree-frog));
    }
    .duo-btn-blue {
      background-color: rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw-shadow));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-blue:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-macaw-shadow));
    }
    .duo-btn-red {
      background-color: rgb(var(--color-cardinal));
      box-shadow: 0 4px 0 rgb(var(--color-fire-ant));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-red:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-fire-ant));
    }
    .duo-btn-outline {
      background-color: white;
      border: 2px solid rgb(var(--color-swan));
      box-shadow: 0 4px 0 rgb(var(--color-swan));
      color: rgb(var(--color-eel));
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
    }
    .duo-btn-outline:hover {
      background-color: rgb(var(--color-polar));
    }
    .duo-btn-outline:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-swan));
    }
    .duo-btn-selected {
      background-color: rgb(var(--color-iguana));
      border: 2px solid rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw));
      color: rgb(24, 153, 214);
      cursor: pointer;
    }

    /* Hebrew on-screen keyboard */
    .kb-toggle-btn { background: linear-gradient(180deg, #f4fbff 0%, #d4f0ff 100%); border: 2px solid #84d8ff; box-shadow: 0 4px 0 #5cc6f7; color: #1899d6; cursor: pointer; transition: transform .1s, box-shadow .1s, background .15s; }
    .kb-toggle-btn:hover { background: linear-gradient(180deg, #ffffff 0%, #c2ebff 100%); }
    .kb-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #5cc6f7; }
    .kb-toggle-btn.kb-on { background: linear-gradient(180deg, #52c7fb 0%, #1cb0f6 100%); border-color: #0e9be0; box-shadow: 0 4px 0 #0f8fd0; color: #ffffff; }
    .kb-panel { background: linear-gradient(180deg, #f4fbff 0%, #def3ff 100%); border: 2px solid #84d8ff; border-radius: 18px; box-shadow: 0 8px 24px rgba(28, 176, 246, .30); }
    .kb-key { background: #ffffff; border: 2px solid #bfe8fd; box-shadow: 0 3px 0 #9fd8f6; color: #17689a; cursor: pointer; transition: transform .08s, box-shadow .08s, background .12s; }
    .kb-key:hover { background: #e8f7ff; }
    .kb-key:active { transform: translateY(3px); box-shadow: 0 0 0 #9fd8f6; background: #d4f0ff; }
    .kb-key-mark { background: #e3f5ff; border-color: #84d8ff; color: #1478b3; }

    .duo-progress-fill { transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1); }

    @keyframes duoBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .duo-start-tooltip { animation: duoBounce 1.5s infinite ease-in-out; }

    @keyframes flashFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.8deg); }
    }
    @keyframes srulikBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes curlBounce {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-6deg); }
      95% { transform: rotate(5deg); }
    }
    .flash-float { animation: flashFloat 2.6s infinite ease-in-out; transform-origin: center; }
    .srulik-eyes { animation: srulikBlink 4s infinite; transform-origin: center 67px; }
    .srulik-curl { animation: curlBounce 3.2s infinite; transform-origin: 105px 42px; }

    .srulik-mascot-click { cursor: pointer; transition: transform .15s; }
    .srulik-mascot-click:hover { transform: scale(1.06) rotate(-2deg); }

    .story-word { position: relative; cursor: pointer; border-bottom: 2px dotted #84d8ff; padding: 0 2px; border-radius: 4px; transition: background .15s; }
    .story-word:hover { background: #ddf4ff; color: #1453a3; }

    @media (max-width: 767px) {
      #primary-sidebar {
        position: fixed !important; top: auto !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
        z-index: 90 !important; display: flex !important; flex-direction: row !important;
        width: 100% !important; height: auto !important; padding: 6px 8px !important;
        background: rgba(255,255,255,.98) !important; border-top: 2px solid #e5e5e5 !important;
      }
      #primary-sidebar .brand-header, #primary-sidebar .sidebar-footer { display: none !important; }
      #primary-sidebar nav { display: grid !important; grid-template-columns: repeat(6, minmax(0, 1fr)) !important; gap: 4px !important; width: 100%; }
      #primary-sidebar nav button { flex-direction: column !important; padding: 6px 2px !important; font-size: 10px !important; gap: 2px !important; }
      .yafa-main { padding-bottom: 110px !important; }
      #srulik-chat-root > div { bottom: 84px !important; }
    }
  </style>
</head>

  <script>
    // ============================================================================
    // SAFE STORAGE HELPERS (PREVENTS CRASHES IN SANDBOXED / FILE:// ENVIRONMENTS)
    // ============================================================================
    function safeGet(key, fallback) {
      try {
        var val = window.localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {}
    }

    // ============================================================================
    // UTILITIES, NORMALIZATION & SYNTHESIZED AUDIO ENGINE
    // ============================================================================
    function stripNikud(text) {
      if (!text) return '';
      return String(text)
        .replace(/[\u0591-\u05C7]/g, '')
        .replace(/[.,?!״"׳'\-]/g, '')
        .trim();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function speakHebrew(text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(stripNikud(text));
        u.lang = 'he-IL';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    var feedbackAudioContext = null;
    function getFeedbackAudioContext() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!feedbackAudioContext) feedbackAudioContext = new AudioCtx();
        return feedbackAudioContext;
      } catch (e) { return null; }
    }

    function playToneSequence(sequence, volume) {
      var ctx = getFeedbackAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') {
        try { ctx.resume(); } catch (e) {}
      }
      try {
        var startAt = ctx.currentTime + 0.005;
        sequence.forEach(function(note) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          var at = startAt + note.at;
          var duration = note.duration || 0.12;
          osc.type = note.type || 'triangle';
          osc.frequency.setValueAtTime(note.freq, at);
          if (note.endFreq) osc.frequency.exponentialRampToValueAtTime(note.endFreq, at + duration);
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, (note.gain || 0.2) * (volume || 1)), at + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(at);
          osc.stop(at + duration + 0.015);
        });
      } catch (e) {}
    }

    function playCorrectSound() {
      playToneSequence([
        { freq: 659.25, at: 0, duration: 0.07, gain: 0.16, type: 'square' },
        { freq: 987.77, at: 0.045, duration: 0.095, gain: 0.17, type: 'triangle' },
        { freq: 1318.51, at: 0.09, duration: 0.12, gain: 0.13, type: 'sine' }
      ], 0.78);
    }
    function playIncorrectSound() {
      playToneSequence([
        { freq: 392.00, endFreq: 293.66, at: 0, duration: 0.105, gain: 0.15, type: 'sine' },
        { freq: 293.66, endFreq: 220.00, at: 0.055, duration: 0.12, gain: 0.13, type: 'triangle' }
      ], 0.72);
    }
    function playVictorySound() {
      playToneSequence([
        { freq: 523.25, at: 0, duration: 0.085, gain: 0.13, type: 'triangle' },
        { freq: 659.25, at: 0.065, duration: 0.095, gain: 0.15, type: 'triangle' },
        { freq: 783.99, at: 0.13, duration: 0.11, gain: 0.16, type: 'square' },
        { freq: 1046.50, at: 0.205, duration: 0.17, gain: 0.17, type: 'sine' },
        { freq: 1567.98, at: 0.25, duration: 0.15, gain: 0.075, type: 'sine' }
      ], 0.76);
    }

    // VOCABULARY DATABASE (HEBREW WITH NIKUD, TRANSLITERATION, ENGLISH, PLURAL, GENDER)
    // ============================================================================

      // Pronouns & People

    // ============================================================================
    function buildVocabUnits() {
      var all = CATEGORIZED_VOCABULARY, cats = [], by = {};
      all.forEach(function(v) { if (!by[v.category]) { by[v.category] = []; cats.push(v.category); } by[v.category].push(v); });
      var palette = [['rgb(28,176,246)', 'rgb(0,150,221)'], ['rgb(88,204,2)', 'rgb(88,167,0)'], ['rgb(255,150,0)', 'rgb(205,121,0)'], ['rgb(206,130,255)', 'rgb(165,104,204)'], ['rgb(20,184,166)', 'rgb(15,140,125)'], ['rgb(244,63,94)', 'rgb(190,45,75)']];
      function opts(w, field, i) {
        var out = [];
        [by[w.category], all].forEach(function(pool) {
          var start = (i * 7) % pool.length;
          for (var j = 0; j < pool.length && out.length < 3; j++) {
            var val = pool[(start + j) % pool.length][field];
            if (val !== w[field] && out.indexOf(val) === -1) out.push(val);
          }
        });
        out.splice(i % 4, 0, w[field]);
        return out;
      }
      var units = [], n = 6;

        var ws = by[cat], k = 0, part = 0;
        while (k < ws.length) {
          var end = k + 4; if (ws.length - end < 3) end = ws.length;
          var ch = ws.slice(k, end); k = end; part++; n++;

          [0, 1, 2, 3].forEach(function(i) {
            var w = ch[i % ch.length];
            if (i % 2 === 0) qs.push({ type: 'multiple_choice', prompt: 'What does this Hebrew word mean?', hebrewPrompt: w.he, translit: w.translit, options: opts(w, 'en', n + i), correctAnswer: w.en, grammarTip: w.he + ' (' + w.translit + ') = ' + w.en + '.' });
            else qs.push({ type: 'irab_detective', prompt: 'How do you say "' + w.en + '" in Hebrew?', sentenceBefore: 'Say:', targetWordBase: '', sentenceAfter: '', translation: w.en, options: opts(w, 'he', n + i).map(function(x) { return { value: x }; }), correctValue: w.he, grammarTip: w.he + ' (' + w.translit + ') = ' + w.en + '.' });
          });

            nodes: [{ id: uid + '-s1', title: cat + ' • Part ' + part, offset: 0, questions: qs }] });

    function buildFormUnits() {
      var units = [], palette = [['rgb(28,176,246)', 'rgb(0,150,221)'], ['rgb(88,204,2)', 'rgb(88,167,0)'], ['rgb(255,150,0)', 'rgb(205,121,0)'], ['rgb(206,130,255)', 'rgb(165,104,204)'], ['rgb(20,184,166)', 'rgb(15,140,125)'], ['rgb(244,63,94)', 'rgb(190,45,75)']];
      function simple(x) { return x && x !== '-' && !/[\/(]/.test(x); }
      function pickOpts(pool, correct, i) {
        var out = [], st = (i * 7 + 3) % pool.length;
        for (var j = 0; j < pool.length && out.length < 3; j++) { var v = pool[(st + j) % pool.length]; if (v !== correct && out.indexOf(v) === -1) out.push(v); }
        out.splice(i % 4, 0, correct); return out;
      }
      function chunks(arr, size) {
        var res = [], k = 0;
        while (k < arr.length) { var end = k + size; if (arr.length - end < 2) end = arr.length; res.push(arr.slice(k, end)); k = end; }
        return res;
      }
      function add(section, title, desc, words, qs) {
        var num = COURSE_UNITS.length + units.length + 1, pal = palette[num % palette.length], uid = 'f' + num;
        units.push({ id: uid, generated: true, unitNumber: 'UNIT ' + num, sectionTitle: section, title: title, description: desc, color: pal[0], shadowColor: pal[1], ruleSummary: '', words: words, nodes: [{ id: uid + '-s1', title: title, offset: 0, questions: qs }] });
      }

        var pool = list.map(function(v) { return v[f]; });
        chunks(list, 4).forEach(function(ch, k) {

          add(cfg[1], cfg[1] + ' • Part ' + (k + 1), ch.map(function(w) { return w.en; }).join(', '), ch.map(function(w) { return { he: w[f] }; }), qs);

    // ============================================================================
    // INTERACTIVE LESSON SESSION ENGINE
    // ============================================================================
    window.startNodeSession = function(unitId, nodeIdx) {
      var unit = COURSE_UNITS.find(function(u) { return u.id === unitId; }) || COURSE_UNITS[0];
      var node = unit.nodes[nodeIdx] || unit.nodes[0];
      state.session = {
        unitId: unit.id,
        nodeId: node.id,
        title: node.title,
        questions: node.questions.slice(),
        qIndex: 0,
        selectedValue: null,
        builderChosen: [],
        matchLeft: null,
        matchedPairs: [],
        checked: false,
        isCorrect: false,
        finished: false
      };
      renderSessionOverlay();
    };

    window.closeSession = function() {
      state.session = null;
      renderSessionOverlay();
      renderApp();
    };

    window.selectSessionOption = function(val) {
      if (!state.session || state.session.checked) return;
      state.session.selectedValue = val;
      renderSessionOverlay();
    };

    window.toggleBuilderWord = function(word) {
      if (!state.session || state.session.checked) return;
      var idx = state.session.builderChosen.indexOf(word);
      if (idx === -1) state.session.builderChosen.push(word);
      else state.session.builderChosen.splice(idx, 1);
      renderSessionOverlay();
    };

    window.clickMatchItem = function(side, val) {
      if (!state.session || state.session.checked) return;
      var s = state.session;
      var q = s.questions[s.qIndex];
      if (side === 'he') {
        s.matchLeft = val;
        speakHebrew(val);
      } else if (side === 'en' && s.matchLeft) {
        var pair = q.pairs.find(function(p) { return p.he === s.matchLeft && p.en === val; });
        if (pair) {
          s.matchedPairs.push(pair.he);
          s.matchLeft = null;
          playCorrectSound();
          if (s.matchedPairs.length === q.pairs.length) {
            s.checked = true;
            s.isCorrect = true;
          }
        } else {
          playIncorrectSound();
          s.matchLeft = null;
        }
      }
      renderSessionOverlay();
    };

    window.checkSessionAnswer = function() {
      var s = state.session;
      if (!s || s.checked) return;
      var q = s.questions[s.qIndex];
      var ok = false;
      if (q.type === 'multiple_choice') {
        ok = s.selectedValue === q.correctAnswer;
      } else if (q.type === 'irab_detective' || q.type === 'word_tap') {
        ok = s.selectedValue === q.correctValue;
      } else if (q.type === 'sentence_builder') {
        ok = s.builderChosen.join(' ') === q.correctOrder.join(' ');
      }
      s.checked = true;
      s.isCorrect = ok;
      if (ok) playCorrectSound();
      else playIncorrectSound();
      renderSessionOverlay();
    };

          '<div>Free key: open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="underline text-[#1899d6]">Google AI Studio ↗</a>, press <strong>Create API key</strong>, paste it here. It stays only in your browser.</div>' +
          '<div class="flex gap-2"><input id="srulik-key-input" type="password" dir="ltr" placeholder="AIza..." class="flex-1 min-w-0 px-2 py-1.5 rounded-lg border-2 border-[#e5e5e5] text-xs" /><button onclick="srulikSaveKey()" class="duo-btn-green px-3 rounded-lg font-extrabold text-xs">Save</button></div>' +
        '</div>' +
        '<div id="srulik-log" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>' +
        '<div class="px-3 pb-2 flex flex-wrap gap-1.5">' + chips + '</div>' +
        '<form onsubmit="sendSrulikMessage(event)" class="p-2.5 bg-white border-t-2 border-[#e5e5e5] flex gap-2">' +
          '<input id="srulik-chat-input" type="text" autocomplete="off" placeholder="Ask about a word, verb or rule..." class="flex-1 min-w-0 px-3 py-2 rounded-xl border-2 border-[#e5e5e5] text-sm font-bold focus:outline-none focus:border-[#1cb0f6]" />' +
          '<button type="submit" class="duo-btn-green px-4 py-2 rounded-xl font-extrabold text-xs">Send</button>' +
        '</form></div>';
      renderSrulikLog(srulikBusy);
      setTimeout(function() { var i = document.getElementById('srulik-chat-input'); if (i) i.focus(); }, 30);
    }

    // ============================================================================
    // MASTER APP RENDER
    // ============================================================================
    function renderApp() {
      var app = document.getElementById('app');
      if (!app) return;
      var mainContent = '';
      if (state.activeTab === 'learn') mainContent = renderLearnTab();
      else if (state.activeTab === 'stories') mainContent = renderStoriesTab();
      else if (state.activeTab === 'verbs') mainContent = renderVerbsTab();
      else if (state.activeTab === 'dictionary') mainContent = renderDictionaryTab();
      else if (state.activeTab === 'grammar') mainContent = renderGrammarTab();
      else if (state.activeTab === 'flashcards') mainContent = renderFlashcardsTab();

      app.innerHTML = '<div class="min-h-screen flex flex-col md:flex-row">' +
        renderSidebar() +
        '<main class="yafa-main flex-1 max-w-5xl w-full mx-auto p-5 sm:p-8">' + mainContent + '</main>' +
      '</div>';
    }

    // Initialize Application safely once DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        renderApp();
        renderKeyboard();
        renderSrulikChat();
      });
    } else {
      renderApp();
      renderKeyboard();
      renderSrulikChat();
    }
  </script>
</body>
</html>
