<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yafa Safa - Learn Hebrew from English (יָפָה שָׂפָה)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-owl: 88, 204, 2;
      --color-tree-frog: 88, 167, 0;
      --color-macaw: 28, 176, 246;
      --color-macaw-shadow: 0, 150, 221;
      --color-bee: 255, 200, 0;
      --color-camel: 231, 166, 1;
      --color-cardinal: 255, 75, 75;
      --color-fire-ant: 234, 43, 43;
      --color-fox: 255, 150, 0;
      --color-beetle: 206, 130, 255;
      --color-swan: 229, 229, 229;
      --color-hare: 175, 175, 175;
      --color-wolf: 119, 119, 119;
      --color-eel: 75, 75, 75;
      --color-polar: 247, 247, 247;
      --color-iguana: 221, 244, 255;
      --color-sea-sponge: 215, 255, 184;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #ffffff; color: #3c3c3c; overflow-x: hidden; }
    .font-hebrew { font-family: 'Rubik', 'Assistant', Arial, sans-serif; direction: rtl; }

    /* Brand Title Multi-color styling (Blue, Green & Red) */
    .brand-yafa { color: #1cb0f6; text-shadow: 0 2px 0 rgba(0, 150, 221, 0.22); }
    .brand-safa { color: #58cc02; text-shadow: 0 2px 0 rgba(88, 167, 0, 0.22); }
    .brand-dot  { color: #ff4b4b; }

    .duo-btn-green {
      background-color: rgb(var(--color-owl));
      box-shadow: 0 4px 0 rgb(var(--color-tree-frog));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-green:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-tree-frog));
    }
    .duo-btn-blue {
      background-color: rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw-shadow));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-blue:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-macaw-shadow));
    }
    .duo-btn-red {
      background-color: rgb(var(--color-cardinal));
      box-shadow: 0 4px 0 rgb(var(--color-fire-ant));
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-red:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-fire-ant));
    }
    .duo-btn-outline {
      background-color: white;
      border: 2px solid rgb(var(--color-swan));
      box-shadow: 0 4px 0 rgb(var(--color-swan));
      color: rgb(var(--color-eel));
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
    }
    .duo-btn-outline:hover {
      background-color: rgb(var(--color-polar));
    }
    .duo-btn-outline:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-swan));
    }
    .duo-btn-selected {
      background-color: rgb(var(--color-iguana));
      border: 2px solid rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw));
      color: rgb(24, 153, 214);
      cursor: pointer;
    }

    /* Hebrew on-screen keyboard */
    .kb-toggle-btn { background: linear-gradient(180deg, #f4fbff 0%, #d4f0ff 100%); border: 2px solid #84d8ff; box-shadow: 0 4px 0 #5cc6f7; color: #1899d6; cursor: pointer; transition: transform .1s, box-shadow .1s, background .15s; }
    .kb-toggle-btn:hover { background: linear-gradient(180deg, #ffffff 0%, #c2ebff 100%); }
    .kb-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #5cc6f7; }
    .kb-toggle-btn.kb-on { background: linear-gradient(180deg, #52c7fb 0%, #1cb0f6 100%); border-color: #0e9be0; box-shadow: 0 4px 0 #0f8fd0; color: #ffffff; }
    .kb-panel { background: linear-gradient(180deg, #f4fbff 0%, #def3ff 100%); border: 2px solid #84d8ff; border-radius: 18px; box-shadow: 0 8px 24px rgba(28, 176, 246, .30); }
    .kb-key { background: #ffffff; border: 2px solid #bfe8fd; box-shadow: 0 3px 0 #9fd8f6; color: #17689a; cursor: pointer; transition: transform .08s, box-shadow .08s, background .12s; }
    .kb-key:hover { background: #e8f7ff; }
    .kb-key:active { transform: translateY(3px); box-shadow: 0 0 0 #9fd8f6; background: #d4f0ff; }
    .kb-key-mark { background: #e3f5ff; border-color: #84d8ff; color: #1478b3; }

    .duo-progress-fill { transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1); }

    @keyframes duoBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .duo-start-tooltip { animation: duoBounce 1.5s infinite ease-in-out; }

    @keyframes flashFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.8deg); }
    }
    @keyframes srulikBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes curlBounce {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-6deg); }
      95% { transform: rotate(5deg); }
    }
    .flash-float { animation: flashFloat 2.6s infinite ease-in-out; transform-origin: center; }
    .srulik-eyes { animation: srulikBlink 4s infinite; transform-origin: center 67px; }
    .srulik-curl { animation: curlBounce 3.2s infinite; transform-origin: 105px 42px; }

    .srulik-mascot-click { cursor: pointer; transition: transform .15s; }
    .srulik-mascot-click:hover { transform: scale(1.06) rotate(-2deg); }

    .story-word { position: relative; cursor: pointer; border-bottom: 2px dotted #84d8ff; padding: 0 2px; border-radius: 4px; transition: background .15s; }
    .story-word:hover { background: #ddf4ff; color: #1453a3; }

    @media (max-width: 767px) {
      #primary-sidebar {
        position: fixed !important; top: auto !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
        z-index: 90 !important; display: flex !important; flex-direction: row !important;
        width: 100% !important; height: auto !important; padding: 6px 8px !important;
        background: rgba(255,255,255,.98) !important; border-top: 2px solid #e5e5e5 !important;
      }
      #primary-sidebar .brand-header, #primary-sidebar .sidebar-footer { display: none !important; }
      #primary-sidebar nav { display: grid !important; grid-template-columns: repeat(6, minmax(0, 1fr)) !important; gap: 4px !important; width: 100%; }
      #primary-sidebar nav button { flex-direction: column !important; padding: 6px 2px !important; font-size: 10px !important; gap: 2px !important; }
      .yafa-main { padding-bottom: 110px !important; }
    }
  </style>
</head>

  <script>
    // ============================================================================
    // SAFE STORAGE HELPERS (PREVENTS CRASHES IN SANDBOXED / FILE:// ENVIRONMENTS)
    // ============================================================================
    function safeGet(key, fallback) {
      try {
        var val = window.localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function safeSet(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {}
    }

    // ============================================================================
    // UTILITIES, NORMALIZATION & SYNTHESIZED AUDIO ENGINE
    // ============================================================================
    function stripNikud(text) {
      if (!text) return '';
      return String(text)
        .replace(/[\u0591-\u05C7]/g, '')
        .replace(/[.,?!״"׳'\-]/g, '')
        .trim();
    }

    function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
    }

    function speakHebrew(text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(stripNikud(text));
        u.lang = 'he-IL';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    var feedbackAudioContext = null;
    function getFeedbackAudioContext() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!feedbackAudioContext) feedbackAudioContext = new AudioCtx();
        return feedbackAudioContext;
      } catch (e) { return null; }
    }

    function playToneSequence(sequence, volume) {
      var ctx = getFeedbackAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') {
        try { ctx.resume(); } catch (e) {}
      }
      try {
        var startAt = ctx.currentTime + 0.005;
        sequence.forEach(function(note) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          var at = startAt + note.at;
          var duration = note.duration || 0.12;
          osc.type = note.type || 'triangle';
          osc.frequency.setValueAtTime(note.freq, at);
          if (note.endFreq) osc.frequency.exponentialRampToValueAtTime(note.endFreq, at + duration);
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, (note.gain || 0.2) * (volume || 1)), at + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(at);
          osc.stop(at + duration + 0.015);
        });
      } catch (e) {}
    }

    function playCorrectSound() {
      playToneSequence([
        { freq: 659.25, at: 0, duration: 0.07, gain: 0.16, type: 'square' },
        { freq: 987.77, at: 0.045, duration: 0.095, gain: 0.17, type: 'triangle' },
        { freq: 1318.51, at: 0.09, duration: 0.12, gain: 0.13, type: 'sine' }
      ], 0.78);
    }
    function playIncorrectSound() {
      playToneSequence([
        { freq: 392.00, endFreq: 293.66, at: 0, duration: 0.105, gain: 0.15, type: 'sine' },
        { freq: 293.66, endFreq: 220.00, at: 0.055, duration: 0.12, gain: 0.13, type: 'triangle' }
      ], 0.72);
    }
    function playVictorySound() {
      playToneSequence([
        { freq: 523.25, at: 0, duration: 0.085, gain: 0.13, type: 'triangle' },
        { freq: 659.25, at: 0.065, duration: 0.095, gain: 0.15, type: 'triangle' },
        { freq: 783.99, at: 0.13, duration: 0.11, gain: 0.16, type: 'square' },
        { freq: 1046.50, at: 0.205, duration: 0.17, gain: 0.17, type: 'sine' },
        { freq: 1567.98, at: 0.25, duration: 0.15, gain: 0.075, type: 'sine' }
      ], 0.76);
    }

    function renderAnnotatedHebrewLine(text, glossary) {
      var tokens = text.split(/(\s+)/);
      return tokens.map(function(tok) {
        if (/^\s+$/.test(tok)) return tok;
        var clean = tok.replace(/[.,?!:;״"]/g, '');
        var meaning = glossary[clean] || glossary[stripNikud(clean)];
        if (!meaning) return escapeHtml(tok);
        return '<span class="story-word" data-he="' + escapeHtml(clean) + '" onclick="speakHebrew(this.dataset.he)" title="' + escapeHtml(meaning) + ' (click for audio)">' + escapeHtml(tok) + '</span>';
      }).join('');
    }

    // ============================================================================
    // INTERACTIVE LESSON SESSION ENGINE
    // ============================================================================
    window.startNodeSession = function(unitId, nodeIdx) {
      var unit = COURSE_UNITS.find(function(u) { return u.id === unitId; }) || COURSE_UNITS[0];
      var node = unit.nodes[nodeIdx] || unit.nodes[0];
      state.session = {
        unitId: unit.id,
        nodeId: node.id,
        title: node.title,
        questions: node.questions.slice(),
        qIndex: 0,
        selectedValue: null,
        builderChosen: [],
        matchLeft: null,
        matchedPairs: [],
        checked: false,
        isCorrect: false,
        finished: false
      };
      renderSessionOverlay();
    };

    window.closeSession = function() {
      state.session = null;
      renderSessionOverlay();
      renderApp();
    };

    window.selectSessionOption = function(val) {
      if (!state.session || state.session.checked) return;
      state.session.selectedValue = val;
      renderSessionOverlay();
    };

    window.toggleBuilderWord = function(word) {
      if (!state.session || state.session.checked) return;
      var idx = state.session.builderChosen.indexOf(word);
      if (idx === -1) state.session.builderChosen.push(word);
      else state.session.builderChosen.splice(idx, 1);
      renderSessionOverlay();
    };

    window.clickMatchItem = function(side, val) {
      if (!state.session || state.session.checked) return;
      var s = state.session;
      var q = s.questions[s.qIndex];
      if (side === 'he') {
        s.matchLeft = val;
        speakHebrew(val);
      } else if (side === 'en' && s.matchLeft) {
        var pair = q.pairs.find(function(p) { return p.he === s.matchLeft && p.en === val; });
        if (pair) {
          s.matchedPairs.push(pair.he);
          s.matchLeft = null;
          playCorrectSound();
          if (s.matchedPairs.length === q.pairs.length) {
            s.checked = true;
            s.isCorrect = true;
          }
        } else {
          playIncorrectSound();
          s.matchLeft = null;
        }
      }
      renderSessionOverlay();
    };

    window.checkSessionAnswer = function() {
      var s = state.session;
      if (!s || s.checked) return;
      var q = s.questions[s.qIndex];
      var ok = false;
      if (q.type === 'multiple_choice') {
        ok = s.selectedValue === q.correctAnswer;
      } else if (q.type === 'irab_detective' || q.type === 'word_tap') {
        ok = s.selectedValue === q.correctValue;
      } else if (q.type === 'sentence_builder') {
        ok = s.builderChosen.join(' ') === q.correctOrder.join(' ');
      }
      s.checked = true;
      s.isCorrect = ok;
      if (ok) playCorrectSound();
      else playIncorrectSound();
      renderSessionOverlay();
    };

    window.nextSessionQuestion = function() {
      var s = state.session;
      if (!s) return;
      if (s.qIndex + 1 < s.questions.length) {
        s.qIndex++;
        s.selectedValue = null;
        s.builderChosen = [];
        s.matchLeft = null;
        s.matchedPairs = [];
        s.checked = false;
        s.isCorrect = false;
      } else {
        s.finished = true;
        state.xp += 25;
        if (state.completedNodes.indexOf(s.nodeId) === -1) state.completedNodes.push(s.nodeId);
        saveProgress();
        playVictorySound();
      }
      renderSessionOverlay();
    };

    function renderSessionOverlay() {
      var root = document.getElementById('session-overlay-root');
      if (!root) return;
      var s = state.session;
      if (!s) { root.innerHTML = ''; return; }

      if (s.finished) {
        root.innerHTML = '<div class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6 text-center">' +
          getSrulikMascotHTML('w-40 h-44', true) +
          '<h2 class="text-3xl font-black text-[#58cc02] mt-4">כָּל הַכָּבוֹד! Lesson Complete!</h2>' +
          '<p class="text-sm font-bold text-[#777777] mt-2">You finished <strong>' + escapeHtml(s.title) + '</strong> and earned <strong>+25 XP</strong>!</p>' +
          '<button onclick="closeSession()" class="duo-btn-green px-8 py-3.5 rounded-2xl font-extrabold text-base mt-6">Continue to Path →</button>' +
        '</div>';
        return;
      }

      var q = s.questions[s.qIndex];
      var pct = Math.round(((s.qIndex + (s.checked ? 1 : 0)) / s.questions.length) * 100);
      var bodyHtml = '';

      if (q.type === 'multiple_choice') {
        var opts = q.options.map(function(opt) {
          var sel = s.selectedValue === opt;
          return '<button data-val="' + escapeHtml(opt) + '" onclick="selectSessionOption(this.dataset.val)" class="p-4 rounded-2xl font-extrabold text-sm text-left ' + (sel ? 'duo-btn-selected' : 'duo-btn-outline') + '">' + escapeHtml(opt) + '</button>';
        }).join('');
        bodyHtml = '<div class="space-y-5">' +
          '<div class="p-5 rounded-3xl border-2 border-[#e5e5e5] bg-[#f7f7f7] flex items-center justify-between gap-4">' +
            '<div>' +
              '<div class="font-hebrew text-3xl font-black text-[#3c3c3c]" dir="rtl">' + escapeHtml(q.hebrewPrompt || '') + '</div>' +
              (q.translit ? '<div class="text-xs font-extrabold text-[#1cb0f6] mt-1">' + escapeHtml(q.translit) + '</div>' : '') +
            '</div>' +
            '<button data-he="' + escapeHtml(q.hebrewPrompt || '') + '" onclick="speakHebrew(this.dataset.he)" class="duo-btn-blue px-4 py-2.5 rounded-2xl font-extrabold text-xs">🔊 Listen</button>' +
          '</div>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' + opts + '</div>' +
        '</div>';
      } else if (q.type === 'irab_detective') {
        var opts2 = q.options.map(function(o) {
          var sel = s.selectedValue === o.value;
          return '<button data-val="' + escapeHtml(o.value) + '" onclick="selectSessionOption(this.dataset.val); speakHebrew(this.dataset.val)" class="p-4 rounded-2xl font-hebrew text-2xl font-bold ' + (sel ? 'duo-btn-selected' : 'duo-btn-outline') + '" dir="rtl">' + escapeHtml(o.value) + '</button>';
        }).join('');
        bodyHtml = '<div class="space-y-5">' +
          '<div class="p-5 rounded-3xl border-2 border-[#e5e5e5] bg-[#f7f7f7] text-center space-y-2">' +
            '<div class="font-hebrew text-3xl font-black text-[#3c3c3c]" dir="rtl">' +
              escapeHtml(q.sentenceBefore) + ' <span class="px-3 py-0.5 rounded-xl bg-[#ddf4ff] text-[#1899d6] border-b-4 border-[#1cb0f6]">' + escapeHtml(s.selectedValue || '___') + '</span> ' + escapeHtml(q.targetWordBase) + ' ' + escapeHtml(q.sentenceAfter) +
            '</div>' +
            '<div class="text-xs font-bold text-[#777777]">' + escapeHtml(q.translation) + '</div>' +
          '</div>' +
          '<div class="grid grid-cols-2 gap-3">' + opts2 + '</div>' +
        '</div>';
      } else if (q.type === 'sentence_builder') {
        var chosenHtml = s.builderChosen.map(function(w) {
          return '<button data-w="' + escapeHtml(w) + '" onclick="toggleBuilderWord(this.dataset.w)" class="duo-btn-selected px-4 py-2 rounded-xl font-hebrew text-xl font-bold">' + escapeHtml(w) + '</button>';
        }).join('');
        var bankHtml = q.words.map(function(w) {
          var used = s.builderChosen.indexOf(w) !== -1;
          return '<button ' + (used ? 'disabled' : '') + ' data-w="' + escapeHtml(w) + '" onclick="toggleBuilderWord(this.dataset.w); speakHebrew(this.dataset.w)" class="duo-btn-outline px-4 py-2.5 rounded-xl font-hebrew text-xl font-bold ' + (used ? 'opacity-30' : '') + '">' + escapeHtml(w) + '</button>';
        }).join('');
        bodyHtml = '<div class="space-y-5">' +
          '<div class="p-4 rounded-2xl bg-[#f7f7f7] border-2 border-[#e5e5e5] font-extrabold text-base text-[#3c3c3c]">"' + escapeHtml(q.englishSentence) + '"</div>' +
          '<div class="min-h-[68px] p-3 rounded-2xl border-2 border-dashed border-[#84d8ff] bg-[#f4fbff] flex flex-wrap gap-2 items-center" dir="rtl">' + (chosenHtml || '<span class="text-xs font-bold text-[#999999]" dir="ltr">Tap Hebrew words below to build the sentence...</span>') + '</div>' +
          '<div class="flex flex-wrap gap-2.5 justify-center" dir="rtl">' + bankHtml + '</div>' +
        '</div>';
      } else if (q.type === 'word_tap') {
        var wordsHtml = q.words.map(function(w) {
          var sel = s.selectedValue === w;
          return '<button data-val="' + escapeHtml(w) + '" onclick="selectSessionOption(this.dataset.val); speakHebrew(this.dataset.val)" class="px-4 py-3 rounded-2xl font-hebrew text-2xl font-bold ' + (sel ? 'duo-btn-red' : 'duo-btn-outline') + '">' + escapeHtml(w) + '</button>';
        }).join('');
        bodyHtml = '<div class="space-y-5 text-center">' +
          '<div class="text-xs font-bold text-[#777777]">' + escapeHtml(q.translation) + '</div>' +
          '<div class="flex flex-wrap gap-3 justify-center p-5 rounded-3xl border-2 border-[#e5e5e5] bg-[#f7f7f7]" dir="rtl">' + wordsHtml + '</div>' +
        '</div>';
      } else if (q.type === 'matching') {
        var leftHtml = q.pairs.map(function(p) {
          var done = s.matchedPairs.indexOf(p.he) !== -1;
          var active = s.matchLeft === p.he;
          return '<button ' + (done ? 'disabled' : '') + ' data-val="' + escapeHtml(p.he) + '" onclick="clickMatchItem(\'he\', this.dataset.val)" class="w-full p-3.5 rounded-2xl font-hebrew text-xl font-bold ' + (done ? 'opacity-30 duo-btn-outline' : active ? 'duo-btn-selected' : 'duo-btn-outline') + '">' + escapeHtml(p.he) + '</button>';
        }).join('');
        var rightHtml = q.pairs.slice().reverse().map(function(p) {
          var done = s.matchedPairs.indexOf(p.he) !== -1;
          return '<button ' + (done ? 'disabled' : '') + ' data-val="' + escapeHtml(p.en) + '" onclick="clickMatchItem(\'en\', this.dataset.val)" class="w-full p-3.5 rounded-2xl font-extrabold text-sm ' + (done ? 'opacity-30 duo-btn-outline' : 'duo-btn-outline') + '">' + escapeHtml(p.en) + '</button>';
        }).join('');
        bodyHtml = '<div class="grid grid-cols-2 gap-4">' +
          '<div class="space-y-2.5">' + leftHtml + '</div>' +
          '<div class="space-y-2.5">' + rightHtml + '</div>' +
        '</div>';
      }

      root.innerHTML = '<div class="fixed inset-0 z-[100] bg-white flex flex-col justify-between">' +
        '<div class="max-w-3xl w-full mx-auto px-5 pt-5 pb-3 flex items-center gap-4">' +
          '<button onclick="closeSession()" class="text-2xl font-black text-[#afafaf] hover:text-[#4b4b4b] bg-transparent border-none cursor-pointer">✕</button>' +
          '<div class="flex-1 h-4 rounded-full bg-[#e5e5e5] overflow-hidden">' +
            '<div class="duo-progress-fill h-full bg-[#58cc02] rounded-full" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<span class="text-xs font-extrabold text-[#777777]">' + (s.qIndex + 1) + ' / ' + s.questions.length + '</span>' +
        '</div>' +
        '<div class="max-w-2xl w-full mx-auto px-5 py-4 flex-1 flex flex-col justify-center space-y-5 overflow-y-auto">' +
          '<h2 class="text-xl sm:text-2xl font-black text-[#3c3c3c]">' + escapeHtml(q.prompt) + '</h2>' +
          bodyHtml +
        '</div>' +
        '<div class="border-t-2 ' + (s.checked ? (s.isCorrect ? 'bg-[#d7ffb8] border-[#58cc02]' : 'bg-[#ffdfe0] border-[#ff4b4b]') : 'bg-white border-[#e5e5e5]') + ' p-5">' +
          '<div class="max-w-3xl w-full mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">' +
            (s.checked ? (
              '<div class="space-y-1 text-left">' +
                '<div class="text-lg font-black ' + (s.isCorrect ? 'text-[#58a700]' : 'text-[#ea2b2b]') + '">' +
                  (s.isCorrect ? '✅ מְצֻיָּן! Correct!' : '❌ Not quite right') +
                '</div>' +
                '<div class="text-xs font-bold text-[#3c3c3c]">' + escapeHtml(q.grammarTip || '') + '</div>' +
              '</div>' +
              '<button onclick="nextSessionQuestion()" class="' + (s.isCorrect ? 'duo-btn-green' : 'duo-btn-red') + ' px-8 py-3.5 rounded-2xl font-extrabold text-sm shrink-0">Continue →</button>'
            ) : (
              '<div class="text-xs font-bold text-[#777777]">Select your answer and press Check</div>' +
              '<button onclick="checkSessionAnswer()" class="duo-btn-green px-8 py-3.5 rounded-2xl font-extrabold text-sm shrink-0">Check Answer</button>'
            )) +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // ============================================================================
    // FLOATING HEBREW KEYBOARD & SRULIK AI TUTOR CHAT
    // ============================================================================
    window.toggleKeyboard = function() {
      state.kbOpen = !state.kbOpen;
      renderKeyboard();
      renderApp();
    };

    window.insertHebrewChar = function(ch) {
      var input = document.getElementById('dict-search-input') || document.getElementById('srulik-chat-input');
      if (!input) return;
      input.value += ch;
      input.dispatchEvent(new Event('input'));
      input.focus();
    };

    function renderKeyboard() {
      var root = document.getElementById('he-keyboard-root');
      if (!root) return;
      if (!state.kbOpen) { root.innerHTML = ''; return; }
      var rows = [
        ['ק','ר','א','ט','ו','ן','ם','פ'],
        ['ש','ד','ג','כ','ע','י','ח','ל','ך','ף'],
        ['ז','ס','ב','ה','נ','מ','צ','ת','ץ']
      ];
      var nikud = ['ָ','ַ','ֵ','ֶ','ִ','ֹ','ֻ','ְ','ּ'];

      var rowsHtml = rows.map(function(r) {
        return '<div class="flex justify-center gap-1.5" dir="rtl">' + r.map(function(k) {
          return '<button type="button" data-ch="' + k + '" onclick="insertHebrewChar(this.dataset.ch)" class="kb-key w-8 h-9 rounded-lg font-hebrew font-bold text-lg">' + k + '</button>';
        }).join('') + '</div>';
      }).join('');

      var nikudHtml = nikud.map(function(n) {
        return '<button type="button" data-ch="' + n + '" onclick="insertHebrewChar(this.dataset.ch)" class="kb-key kb-key-mark w-8 h-8 rounded-lg font-hebrew font-bold text-lg">א' + n + '</button>';
      }).join('');

      root.innerHTML = '<div class="kb-panel fixed bottom-5 right-5 z-[85] p-3.5 w-[350px] space-y-2">' +
        '<div class="flex items-center justify-between text-xs font-extrabold text-[#1899d6] pb-1">' +
          '<span>⌨️ Hebrew Keyboard (מִקְלֶדֶת עִבְרִית)</span>' +
          '<button onclick="toggleKeyboard()" class="px-2 py-0.5 rounded-lg bg-white border border-[#84d8ff] cursor-pointer">✕</button>' +
        '</div>' +
        rowsHtml +
        '<div class="flex justify-center gap-1 pt-1 border-t border-[#bfe8fd]" dir="rtl">' + nikudHtml + '</div>' +
      '</div>';
    }

    window.toggleSrulikChat = function() {
      state.chatOpen = !state.chatOpen;
      renderSrulikChat();
    };

    window.sendSrulikMessage = function(e) {
      if (e) e.preventDefault();
      var input = document.getElementById('srulik-chat-input');
      if (!input || !input.value.trim()) return;
      var q = input.value.trim();
      state.chatMessages.push({ from: 'user', text: q });
      input.value = '';

      var qLow = q.toLowerCase();
      var qClean = stripNikud(q);
      var reply = '';

      var foundVocab = CATEGORIZED_VOCABULARY.find(function(v) {
        return v.en.toLowerCase().indexOf(qLow) !== -1 || v.translit.toLowerCase() === qLow || stripNikud(v.he) === qClean;
      });
      var foundVerb = VERB_CONJUGATION_DB.find(function(v) {
        return v.meaning.toLowerCase().indexOf(qLow) !== -1 || stripNikud(v.lemma) === qClean;
      });

      if (qLow.indexOf('et') !== -1 || qClean === 'את') {
        reply = 'In Hebrew, **אֶת (et)** is placed right before a **definite direct object** (a noun with הַ־ or a proper name). For example: **קָרָאתִי אֶת הַסֵּפֶר** (I read *the* book), vs. **קָרָאתִי סֵפֶר** (I read *a* book — no אֶת!).';
      } else if (qLow.indexOf('smichut') !== -1 || qLow.indexOf('construct') !== -1) {
        reply = '**סְמִיכוּת (Smichut)** links two nouns together! Only the second noun takes **הַ־** (e.g., **בֵּית הַקָּפֶה** = the coffee shop), and feminine singular **־ָה** changes to **־ַת** (e.g., **עוּגַת תַּפּוּחִים** = apple cake).';
      } else if (foundVerb) {
        reply = '**' + foundVerb.lemma + '** (' + foundVerb.infinitive + ') means **"' + foundVerb.meaning + '"** • Root: **' + foundVerb.root + '** (' + foundVerb.binyan + '). Present: **' + foundVerb.forms.present.hu + '** | Past (I): **' + foundVerb.forms.past.ani + '** | Future (I): **' + foundVerb.forms.future.ani + '**.';
      } else if (foundVocab) {
        reply = 'In Hebrew, **"' + foundVocab.en + '"** is **' + foundVocab.he + '** (*' + foundVocab.translit + '*). ' + (foundVocab.plural !== '-' ? 'Plural: **' + foundVocab.plural + '**.' : '');
      } else {
        reply = 'יוֹפִי שֶׁל שְׁאֵלָה! (Great question!) Try asking me about any English word (like *"coffee"*, *"university"*, *"write"*), a Hebrew word, or grammar rules like **אֶת** and **Smichut**!';
      }

      state.chatMessages.push({ from: 'srulik', text: reply });
      renderSrulikChat();
    };

    function renderSrulikChat() {
      var root = document.getElementById('srulik-chat-root');
      if (!root) return;
      if (!state.chatOpen) {
        root.innerHTML = '<button onclick="toggleSrulikChat()" title="Chat with Srulik" class="fixed bottom-5 left-5 z-[80] w-16 h-16 rounded-2xl bg-[#fff5d3] border-2 border-[#ffc800] shadow-lg flex items-center justify-center hover:scale-105 transition-transform cursor-pointer">' +
          getSrulikMascotHTML('w-14 h-14', true) +
        '</button>';
        return;
      }

      var msgsHtml = state.chatMessages.map(function(m) {
        var isUser = m.from === 'user';
        return '<div class="flex ' + (isUser ? 'justify-end' : 'justify-start') + '">' +
          '<div class="max-w-[85%] p-3 rounded-2xl text-xs font-bold leading-relaxed ' + (isUser ? 'bg-[#1cb0f6] text-white' : 'bg-white border-2 border-[#e5e5e5] text-[#3c3c3c]') + '">' +
            escapeHtml(m.text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') +
          '</div>' +
        '</div>';
      }).join('');

      root.innerHTML = '<div class="fixed bottom-5 left-5 z-[95] w-[360px] max-w-[calc(100vw-24px)] rounded-3xl bg-[#f7f7f7] border-2 border-[#84d8ff] shadow-2xl overflow-hidden flex flex-col max-h-[500px]">' +
        '<div class="bg-gradient-to-r from-[#1cb0f6] to-[#58cc02] p-3.5 text-white flex items-center justify-between">' +
          '<div class="flex items-center gap-2">' +
            '<span class="text-lg">🧢</span>' +
            '<div>' +
              '<div class="font-black text-sm">Srulik — Hebrew Tutor</div>' +
              '<div class="text-[10px] font-bold opacity-90">שְׂרוּלִיק • Ask about words, roots & grammar</div>' +
            '</div>' +
          '</div>' +
          '<button onclick="toggleSrulikChat()" class="font-black text-lg px-2 bg-transparent border-none text-white cursor-pointer">✕</button>' +
        '</div>' +
        '<div class="p-3.5 space-y-2.5 overflow-y-auto flex-1">' + msgsHtml + '</div>' +
        '<form onsubmit="sendSrulikMessage(event)" class="p-2.5 bg-white border-t-2 border-[#e5e5e5] flex gap-2">' +
          '<input id="srulik-chat-input" type="text" placeholder="Ask Srulik (e.g. coffee, et, smichut)..." class="flex-1 px-3 py-2 rounded-xl border-2 border-[#e5e5e5] text-xs font-bold focus:outline-none focus:border-[#1cb0f6]" />' +
          '<button type="submit" class="duo-btn-green px-3.5 py-2 rounded-xl font-extrabold text-xs">Send</button>' +
        '</form>' +
      '</div>';
    }

    // ============================================================================
    // MASTER APP RENDER
    // ============================================================================
    function renderApp() {
      var app = document.getElementById('app');
      if (!app) return;
      var mainContent = '';
      if (state.activeTab === 'learn') mainContent = renderLearnTab();
      else if (state.activeTab === 'stories') mainContent = renderStoriesTab();
      else if (state.activeTab === 'verbs') mainContent = renderVerbsTab();
      else if (state.activeTab === 'dictionary') mainContent = renderDictionaryTab();
      else if (state.activeTab === 'grammar') mainContent = renderGrammarTab();
      else if (state.activeTab === 'flashcards') mainContent = renderFlashcardsTab();

      app.innerHTML = '<div class="min-h-screen flex flex-col md:flex-row">' +
        renderSidebar() +
        '<main class="yafa-main flex-1 max-w-5xl w-full mx-auto p-5 sm:p-8">' + mainContent + '</main>' +
      '</div>';
    }

    // Initialize Application safely once DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        renderApp();
        renderKeyboard();
        renderSrulikChat();
      });
    } else {
      renderApp();
      renderKeyboard();
      renderSrulikChat();
    }
  </script>
</body>
</html>
